name: Build 6 Vitesses Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Create Android local.properties
        run: |
          test -n "$FLUTTER_ROOT"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          echo "Generated android/local.properties for GitHub Actions."

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/6-vitesses-release.jks
          test -s android/app/6-vitesses-release.jks
          chmod 600 android/app/6-vitesses-release.jks
          echo "Release keystore restored."

      - name: Verify release signing configuration
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          keytool -list -v \
            -keystore android/app/6-vitesses-release.jks \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            | grep -E "Alias name:|SHA256:"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify static Android project
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/sixvitesses/six_vitesses/MainActivity.kt
          echo "Static Android project is present."
          echo "Location declarations:"
          grep -n "ACCESS_.*LOCATION" android/app/src/main/AndroidManifest.xml
          echo "Application identity:"
          grep -n "namespace\|applicationId" android/app/build.gradle

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.9
          test -x gradlew
          ./gradlew --version

      - run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Verify Android manifest after plugin generation
        run: |
          echo "Manifest after launcher/splash generation:"
          cat android/app/src/main/AndroidManifest.xml
          echo "Location declarations:"
          grep -n "ACCESS_.*LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Verify release manifest processing
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/6-vitesses-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:processReleaseMainManifest --stacktrace
          echo "Release manifest processing completed successfully."

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/6-vitesses-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Deep verify final APK and merged release manifest
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"

          echo "=== APK SHA-256 ==="
          sha256sum "$APK"

          echo "=== APK badging ==="
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging-deep.txt

          echo "=== APK permissions ==="
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions-deep.txt

          echo "=== APK manifest tree ==="
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/apk-manifest-tree.txt

          echo "=== AndroidManifest files produced by the release build ==="
          find android/app/build -type f -name AndroidManifest.xml -print | sort
          MERGED="$(find android/app/build -type f -name AndroidManifest.xml -print | grep -E '/(merged_manifests|merged_manifest|packaged_manifests)/' | grep -E '/release/' | head -1 || true)"
          if [ -n "$MERGED" ]; then
            echo "Using merged release manifest: $MERGED"
            cat "$MERGED"
            echo "=== Required merged manifest permissions ==="
            grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MERGED"
            grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MERGED"
            grep -q 'android.permission.INTERNET' "$MERGED"
            grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MERGED"
          else
            echo "No standalone merged-manifest file matched the AGP output layout; final APK manifest will be the authoritative check."
          fi

          echo "=== APK identity and location permissions ==="
          grep -q "package: name='com.sixvitesses.six_vitesses'" /tmp/apk-badging-deep.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/apk-permissions-deep.txt
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' /tmp/apk-permissions-deep.txt

          echo "=== Target SDK ==="
          TARGET_SDK="$(sed -n 's/.*targetSdkVersion:\\([0-9][0-9]*\\).*/\\1/p' /tmp/apk-badging-deep.txt | head -1)"
          test -n "$TARGET_SDK"
          echo "Final APK targetSdkVersion=$TARGET_SDK"

          echo "=== All final APK permissions ==="
          cat /tmp/apk-permissions-deep.txt

          echo "DEEP APK VERIFICATION PASSED"

      - name: Verify signed APK identity and permissions
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-badging.txt
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-permissions.txt
          grep -q "package: name='com.sixvitesses.six_vitesses'" /tmp/apk-badging.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_COARSE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" /tmp/apk-permissions.txt
          echo "APK identity and permissions verified."

      - name: Verify APK signing certificate
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          echo "APK certificate:"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          echo "Expected certificate:"
          keytool -list -v \
            -keystore android/app/6-vitesses-release.jks \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            | grep "SHA256:"

      - name: Build signed AAB
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/6-vitesses-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Cleanup release keystore
        if: always()
        run: rm -f android/app/6-vitesses-release.jks
