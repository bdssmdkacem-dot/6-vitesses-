name: Build 6 Vitesses Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze Test and Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name=six_vitesses --org=com.sixvitesses

      - name: Add location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
          ]
          for name in permissions:
              if f'android:name="{name}"' not in s:
                  s = s.replace(
                      "<application",
                      f'    <uses-permission android:name="{name}"/>\\n    <application',
                      1,
                  )
          p.write_text(s)
          print("Android permissions configured.")
          PY

      - name: Add native foreground location request
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/kotlin/com/sixvitesses/six_vitesses/MainActivity.kt")
          p.parent.mkdir(parents=True, exist_ok=True)

          lines = [
              "package com.sixvitesses.six_vitesses",
              "",
              "import android.Manifest",
              "import android.content.pm.PackageManager",
              "import android.os.Handler",
              "import android.os.Looper",
              "import io.flutter.embedding.android.FlutterActivity",
              "",
              "class MainActivity : FlutterActivity() {",
              "    private companion object {",
              "        const val REQUEST_CODE = 6101",
              "        const val DELAY_MS = 800L",
              "    }",
              "",
              "    private val handler = Handler(Looper.getMainLooper())",
              "    private var requestPosted = false",
              "",
              "    override fun onPostResume() {",
              "        super.onPostResume()",
              "        requestLocationIfNeeded()",
              "    }",
              "",
              "    private fun requestLocationIfNeeded() {",
              "        if (android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.M) return",
              "",
              "        val fine = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)",
              "        val coarse = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)",
              "",
              "        if (fine == PackageManager.PERMISSION_GRANTED ||",
              "            coarse == PackageManager.PERMISSION_GRANTED) {",
              "            requestPosted = false",
              "            return",
              "        }",
              "",
              "        if (requestPosted || isFinishing || isDestroyed) return",
              "        requestPosted = true",
              "",
              "        handler.postDelayed({",
              "            requestPosted = false",
              "            if (isFinishing || isDestroyed) return@postDelayed",
              "",
              "            val currentFine = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)",
              "            val currentCoarse = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)",
              "",
              "            if (currentFine != PackageManager.PERMISSION_GRANTED &&",
              "                currentCoarse != PackageManager.PERMISSION_GRANTED) {",
              "                requestPermissions(",
              "                    arrayOf(",
              "                        Manifest.permission.ACCESS_FINE_LOCATION,",
              "                        Manifest.permission.ACCESS_COARSE_LOCATION",
              "                    ),",
              "                    REQUEST_CODE",
              "                )",
              "            }",
              "        }, DELAY_MS)",
              "    }",
              "",
              "    override fun onRequestPermissionsResult(",
              "        requestCode: Int,",
              "        permissions: Array<out String>,",
              "        grantResults: IntArray",
              "    ) {",
              "        super.onRequestPermissionsResult(requestCode, permissions, grantResults)",
              "        if (requestCode == REQUEST_CODE) requestPosted = false",
              "    }",
              "",
              "    override fun onDestroy() {",
              "        handler.removeCallbacksAndMessages(null)",
              "        super.onDestroy()",
              "    }",
              "}",
          ]

          p.write_text("\n".join(lines) + "\n")
          print(f"Generated {p}")
          PY

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks release-keystore.jks --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK permissions
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_COARSE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" /tmp/apk-permissions.txt

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Sign release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          zip -d "$AAB" 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/*.EC' || true
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release-keystore.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Clean signing material
        if: always()
        run: rm -f release-keystore.jks android/key.properties

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
