name: Build 6 Vitesses Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Create Android local.properties
        run: |
          test -n "$FLUTTER_ROOT"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          echo "Generated android/local.properties for GitHub Actions."
          cat android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify static Android project
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/sixvitesses/six_vitesses/MainActivity.kt
          echo "Static Android project is present."
          echo "Location declarations:"
          grep -n "ACCESS_.*LOCATION" android/app/src/main/AndroidManifest.xml
          echo "Application identity:"
          grep -n "namespace\|applicationId" android/app/build.gradle

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.9
          test -x gradlew
          ./gradlew --version

      - run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Verify Android manifest after plugin generation
        run: |
          echo "Manifest after launcher/splash generation:"
          cat android/app/src/main/AndroidManifest.xml
          echo "Location declarations:"
          grep -n "ACCESS_.*LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Verify merged release manifest
        run: |
          cd android
          ./gradlew :app:processReleaseMainManifest --stacktrace
          MANIFEST=$(find app/build/intermediates -path '*merged_manifests*' -name AndroidManifest.xml -print -quit)
          test -n "$MANIFEST"
          echo "Merged release manifest: $MANIFEST"
          cat "$MANIFEST"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"
          grep -q 'com.sixvitesses.six_vitesses' "$MANIFEST"
          echo "Merged manifest location verification passed."

      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK identity and permissions
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-badging.txt
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-permissions.txt
          grep -q "package: name='com.sixvitesses.six_vitesses'" /tmp/apk-badging.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_COARSE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" /tmp/apk-permissions.txt
          echo "APK identity and location permissions verified."

      - name: Build AAB
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
