name: Build 6 Vitesses Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --project-name=six_vitesses --org=com.sixvitesses
      - name: Add Android network and location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<application'

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
          ]

          for permission in permissions:
              name = permission.split('android:name="', 1)[1].split('"', 1)[0]
              if f'android:name="{name}"' not in s:
                  s = s.replace(marker, permission + '\n' + marker, 1)

          p.write_text(s)

          print("Final AndroidManifest permissions:")
          for line in s.splitlines():
              if '<uses-permission' in line:
                  print(line.strip())
          PY
      - name: Add native foreground location request
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/kotlin/com/sixvitesses/six_vitesses/MainActivity.kt")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("""package com.sixvitesses.six_vitesses

import android.Manifest
import android.content.pm.PackageManager
import android.os.Bundle
import android.os.Handler
import android.os.Looper
import io.flutter.embedding.android.FlutterActivity

class MainActivity : FlutterActivity() {
    private companion object {
        const val REQUEST_CODE = 6101
        const val DELAY_MS = 800L
    }

    private val handler = Handler(Looper.getMainLooper())
    private var requestPosted = false

    override fun onPostResume() {
        super.onPostResume()
        requestLocationIfNeeded()
    }

    private fun requestLocationIfNeeded() {
        if (android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.M) return

        val fine = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
        val coarse = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)
        if (fine == PackageManager.PERMISSION_GRANTED ||
            coarse == PackageManager.PERMISSION_GRANTED) {
            requestPosted = false
            return
        }

        if (requestPosted || isFinishing || isDestroyed) return
        requestPosted = true

        handler.postDelayed({
            requestPosted = false
            if (isFinishing || isDestroyed) return@postDelayed

            val currentFine = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
            val currentCoarse = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)
            if (currentFine != PackageManager.PERMISSION_GRANTED &&
                currentCoarse != PackageManager.PERMISSION_GRANTED
            ) {
                requestPermissions(
                    arrayOf(
                        Manifest.permission.ACCESS_FINE_LOCATION,
                        Manifest.permission.ACCESS_COARSE_LOCATION
                    ),
                    REQUEST_CODE
                )
            }
        }, DELAY_MS)
    }

    override fun onRequestPermissionsResult(
        requestCode: Int,
        permissions: Array<out String>,
        grantResults: IntArray
    ) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults)
        if (requestCode == REQUEST_CODE) requestPosted = false
    }

    override fun onDestroy() {
        handler.removeCallbacksAndMessages(null)
        super.onDestroy()
    }
}
""")
          print(p)
          PY
      - run: flutter pub get
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons
      - name: Generate native splash
        run: dart run flutter_native_splash:create
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Verify APK permissions
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_COARSE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" /tmp/apk-permissions.txt
      - name: Build AAB
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
