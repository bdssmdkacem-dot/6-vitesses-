name: Build 6 Vitesses Android

on:
  push:
    branches: [main, production-hud]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name=six_vitesses --org=com.sixvitesses

      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = "<application"
          permissions = """    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          """
          if "ACCESS_FINE_LOCATION" not in s:
              s = s.replace(marker, permissions + marker)
          p.write_text(s)
          PY

      - name: Configure release signing
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Apply release signing config
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'val keystorePropertiesFile' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
              block = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }
          }

          '''
              s = s.replace("android {", block + "android {", 1)
              signing = '''signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String?
                  keyPassword = keystoreProperties["keyPassword"] as String?
                  storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                  storePassword = keystoreProperties["storePassword"] as String?
              }
          }

          '''
              s = s.replace("    buildTypes {", "    " + signing + "    buildTypes {", 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          PY

      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Cleanup signing material
        if: always()
        run: rm -f android/release-keystore.jks android/key.properties
