name: Build 6 Vitesses Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze Test and Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name=six_vitesses --org=com.sixvitesses

      - name: Set automatic Android version code
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          test -n "$VERSION_CODE"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("pubspec.yaml")
          s = p.read_text()
          version_code = int(os.environ["VERSION_CODE"])
          m = re.search(r"(?m)^version:\s*([^+\s]+)(?:\+(\d+))?\s*$", s)
          if not m:
              raise SystemExit("ERROR: pubspec.yaml version field not found")

          version_name = m.group(1)
          old_code = int(m.group(2) or "0")
          new_code = max(old_code + 1, version_code)
          new_version = f"version: {version_name}+{new_code}"
          s = s[:m.start()] + new_version + s[m.end():]
          p.write_text(s)

          print(f"Version name: {version_name}")
          print(f"Previous versionCode: {old_code}")
          print(f"Automatic versionCode: {new_code}")
          PY

          grep -n '^version:' pubspec.yaml

      - name: Add location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
          ]
          for name in permissions:
              if f'android:name="{name}"' not in s:
                  s = s.replace(
                      "<application",
                      f'    <uses-permission android:name="{name}"/>\\n    <application',
                      1,
                  )
          p.write_text(s)
          print("Android permissions configured.")
          PY

      - name: Add native foreground location request
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/kotlin/com/sixvitesses/six_vitesses/MainActivity.kt")
          p.parent.mkdir(parents=True, exist_ok=True)

          lines = [
              "package com.sixvitesses.six_vitesses",
              "",
              "import android.Manifest",
              "import android.content.pm.PackageManager",
              "import android.os.Handler",
              "import android.os.Looper",
              "import io.flutter.embedding.android.FlutterActivity",
              "",
              "class MainActivity : FlutterActivity() {",
              "    private companion object {",
              "        const val REQUEST_CODE = 6101",
              "        const val DELAY_MS = 800L",
              "    }",
              "",
              "    private val handler = Handler(Looper.getMainLooper())",
              "    private var requestPosted = false",
              "",
              "    override fun onPostResume() {",
              "        super.onPostResume()",
              "        requestLocationIfNeeded()",
              "    }",
              "",
              "    private fun requestLocationIfNeeded() {",
              "        if (android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.M) return",
              "",
              "        val fine = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)",
              "        val coarse = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)",
              "",
              "        if (fine == PackageManager.PERMISSION_GRANTED ||",
              "            coarse == PackageManager.PERMISSION_GRANTED) {",
              "            requestPosted = false",
              "            return",
              "        }",
              "",
              "        if (requestPosted || isFinishing || isDestroyed) return",
              "        requestPosted = true",
              "",
              "        handler.postDelayed({",
              "            requestPosted = false",
              "            if (isFinishing || isDestroyed) return@postDelayed",
              "",
              "            val currentFine = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)",
              "            val currentCoarse = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)",
              "",
              "            if (currentFine != PackageManager.PERMISSION_GRANTED &&",
              "                currentCoarse != PackageManager.PERMISSION_GRANTED) {",
              "                requestPermissions(",
              "                    arrayOf(",
              "                        Manifest.permission.ACCESS_FINE_LOCATION,",
              "                        Manifest.permission.ACCESS_COARSE_LOCATION",
              "                    ),",
              "                    REQUEST_CODE",
              "                )",
              "            }",
              "        }, DELAY_MS)",
              "    }",
              "",
              "    override fun onRequestPermissionsResult(",
              "        requestCode: Int,",
              "        permissions: Array<out String>,",
              "        grantResults: IntArray",
              "    ) {",
              "        super.onRequestPermissionsResult(requestCode, permissions, grantResults)",
              "        if (requestCode == REQUEST_CODE) requestPosted = false",
              "    }",
              "",
              "    override fun onDestroy() {",
              "        handler.removeCallbacksAndMessages(null)",
              "        super.onDestroy()",
              "    }",
              "}",
          ]

          p.write_text("\n".join(lines) + "\n")
          print(f"Generated {p}")
          PY

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Configure Gradle release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -f release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\n" + s
          if 'create("release")' not in s:
              s = s.replace("    buildTypes {", """    signingConfigs {
              create("release") {
                  val props = Properties()
                  val propsFile = rootProject.file("key.properties")
                  require(propsFile.isFile) { "android/key.properties is missing" }
                  propsFile.inputStream().use { props.load(it) }
                  storeFile = rootProject.file(props["storeFile"].toString())
                  storePassword = props["storePassword"].toString()
                  keyAlias = props["keyAlias"].toString()
                  keyPassword = props["keyPassword"].toString()
              }
          }

          buildTypes {""", 1)
          # Flutter's generated template may assign the debug key to release.
          # Replace that assignment so release/AAB builds use the verified keystore.
          # Flutter 3.41.x may generate either debug signing syntax.
          # Replace both forms so the release build can never fall back to debug.
          s = s.replace(
              'signingConfig = signingConfigs.debug',
              'signingConfig = signingConfigs.getByName("release")'
          )
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace("        release {", """        release {
              signingConfig = signingConfigs.getByName("release")""", 1)
          p.write_text(s)
          PY

      - name: Verify Gradle release signing configuration
        run: |
          grep -n -A12 -B2 'release {' android/app/build.gradle.kts
          if grep -qE 'signingConfig = signingConfigs\.(debug|getByName\("debug"\))' android/app/build.gradle.kts; then
            echo "ERROR: release build still references the debug signing key."
            exit 1
          fi
          RELEASE_SIGNING_COUNT=$(grep -c 'signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts || true)
          test "$RELEASE_SIGNING_COUNT" -ge 1
          echo "Release signing config is enforced; debug signing is absent."

      - name: Verify keystore certificate before build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -f release-keystore.jks
          ACTUAL_KEYSTORE_SHA1=$(keytool -list -v \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" |
            awk -F': ' '/Certificate fingerprints:/{f=1;next} f && /SHA1:/{print $2; exit}')
          ACTUAL_KEYSTORE_SHA1=$(echo "$ACTUAL_KEYSTORE_SHA1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          EXPECTED_SHA1="03:E1:62:FC:E3:CA:17:05:83:B8:E3:E7:8D:BF:09:D9:0D:29:3A:4E"
          EXPECTED_SHA1=$(echo "$EXPECTED_SHA1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          echo "Keystore SHA1: $ACTUAL_KEYSTORE_SHA1"
          echo "Expected SHA1:  $EXPECTED_SHA1"
          test -n "$ACTUAL_KEYSTORE_SHA1"
          test "$ACTUAL_KEYSTORE_SHA1" = "$EXPECTED_SHA1"

      - name: Get dependencies
        run: flutter pub get

      - name: Remove unnecessary foreground-service permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # This app uses location only while its visible Activity is in use.
          # geolocator declares foreground-service location permission in its
          # plugin manifest, so explicitly remove it from the merged app.
          if 'xmlns:tools=' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\\n    xmlns:tools="http://schemas.android.com/tools"',
                  1,
              )

          removals = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_LOCATION",
          ]
          for name in removals:
              tag = f'<uses-permission android:name="{name}" tools:node="remove"/>'
              if tag not in s:
                  s = s.replace(
                      '<application',
                      f'    {tag}\\n    <application',
                      1,
                  )
          p.write_text(s)
          print("Foreground-service permissions explicitly removed for this foreground-only app.")
          PY

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks release-keystore.jks --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK permissions
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_COARSE_LOCATION" /tmp/apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/apk-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" /tmp/apk-permissions.txt
          if grep -qE "android.permission.FOREGROUND_SERVICE(_LOCATION)?($|[^A-Z_])" /tmp/apk-permissions.txt; then
            echo "ERROR: foreground-service permission is still present in the release APK."
            exit 1
          fi
          echo "Verified: no foreground-service permissions are packaged."

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Sign release AAB explicitly
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB"

          # Flutter/AGP may leave the generated AAB signed with another key.
          # Remove any existing JAR signatures, then sign the final bundle
          # explicitly with the verified Play upload keystore.
          zip -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' || true

          jarsigner             -keystore release-keystore.jks             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -sigalg SHA256withRSA             -digestalg SHA-256             "$AAB"             "$KEY_ALIAS"

      - name: Verify AAB signing certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          EXPECTED_SHA1="03:E1:62:FC:E3:CA:17:05:83:B8:E3:E7:8D:BF:09:D9:0D:29:3A:4E"
          EXPECTED_SHA1=$(echo "$EXPECTED_SHA1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')

          # Verify the actual certificate embedded in the final AAB.
          ACTUAL_AAB_SHA1=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab |
            awk -F': ' '/SHA1:/{print $2; exit}')
          ACTUAL_AAB_SHA1=$(echo "$ACTUAL_AAB_SHA1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')

          echo "AAB SHA1:      $ACTUAL_AAB_SHA1"
          echo "Expected SHA1: $EXPECTED_SHA1"
          test -n "$ACTUAL_AAB_SHA1"
          test "$ACTUAL_AAB_SHA1" = "$EXPECTED_SHA1"

          jarsigner -verify -verbose -certs "$AAB" >/dev/null 2>&1 || {
            echo "ERROR: jarsigner verification failed."
            exit 1
          }

          echo "AAB signing certificate matches the required Play certificate."

      - name: Verify APK generated directly from AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          EXPECTED_SHA1="03:E1:62:FC:E3:CA:17:05:83:B8:E3:E7:8D:BF:09:D9:0D:29:3A:4E"
          EXPECTED_SHA1=$(echo "$EXPECTED_SHA1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          BUNDLETOOL_VERSION="1.18.1"
          curl -fsSL -o /tmp/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          java -jar /tmp/bundletool.jar validate --bundle="$AAB"
          rm -rf /tmp/aab-apks /tmp/aab-apks-unpacked && mkdir -p /tmp/aab-apks-unpacked
          java -jar /tmp/bundletool.jar build-apks \
            --bundle="$AAB" \
            --output=/tmp/aab-apks/app.apks \
            --mode=universal \
            --ks=release-keystore.jks \
            --ks-pass=pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass=pass:"$KEY_PASSWORD" \
            --overwrite
          unzip -q /tmp/aab-apks/app.apks -d /tmp/aab-apks-unpacked
          test -f /tmp/aab-apks-unpacked/universal.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs /tmp/aab-apks-unpacked/universal.apk | tee /tmp/aab-apk-cert.txt
          ACTUAL_APK_SHA1=$(awk -F': ' '/Signer #1 certificate SHA-1 digest:/{print $2; exit}' /tmp/aab-apk-cert.txt)
          ACTUAL_APK_SHA1=$(echo "$ACTUAL_APK_SHA1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          echo "Generated APK SHA1: $ACTUAL_APK_SHA1"
          echo "Expected SHA1:      $EXPECTED_SHA1"
          test -n "$ACTUAL_APK_SHA1" && test "$ACTUAL_APK_SHA1" = "$EXPECTED_SHA1"
          echo "AAB -> APK certificate verification passed."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Clean signing material
        if: always()
        run: rm -f release-keystore.jks android/key.properties

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: six-vitesses-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
