name: six_vitesses
description: "6 Vitesses — HUD and driving dashboard for Android."
publish_to: "none"
version: 0.2.1+3
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  sensors_plus: ^6.1.1
  wakelock_plus: ^1.4.0
  shared_preferences: ^2.5.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/splash/6vitesses_splash.png

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#05070A"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#05070A"
  image: assets/splash/6vitesses_splash.png
  android: true
  ios: false
  web: false
  fullscreen: true
  android_12:
    color: "#05070A"
    image: assets/icon/icon.png
    icon_background_color: "#05070A"
